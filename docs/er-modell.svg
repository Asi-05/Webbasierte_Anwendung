<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" font-family="Arial, Helvetica, sans-serif" font-size="16">
  <rect width="960" height="340" fill="#ffffff"/>

  <g stroke="#222" stroke-width="1.5" fill="none">
    <!-- Attribut-Linien Kategorie -->
    <line x1="100" y1="122" x2="130" y2="200"/>
    <line x1="220" y1="122" x2="200" y2="200"/>
    <!-- Attribut-Linien Aufgabe -->
    <line x1="560" y1="122" x2="610" y2="200"/>
    <line x1="660" y1="102" x2="665" y2="200"/>
    <line x1="790" y1="102" x2="720" y2="200"/>
    <line x1="890" y1="132" x2="770" y2="200"/>

    <!-- Kategorie zu Beziehung (partielle Teilnahme: einfache Linie) -->
    <line x1="240" y1="230" x2="310" y2="230"/>
    <!-- Beziehung zu Aufgabe (totale Teilnahme: Doppellinie) -->
    <line x1="490" y1="226" x2="580" y2="226"/>
    <line x1="490" y1="234" x2="580" y2="234"/>
  </g>

  <!-- Entitätstypen -->
  <g stroke="#222" stroke-width="2" fill="#dbe8f7">
    <rect x="80" y="200" width="160" height="60"/>
    <rect x="580" y="200" width="200" height="60"/>
  </g>
  <g font-weight="bold" font-size="18" text-anchor="middle" fill="#111">
    <text x="160" y="236">Kategorie</text>
    <text x="680" y="236">Aufgabe</text>
  </g>

  <!-- Beziehungstyp -->
  <polygon points="400,180 490,230 400,280 310,230" stroke="#222" stroke-width="2" fill="#fdf0c8"/>
  <text x="400" y="235" text-anchor="middle" fill="#111">gehört zu</text>

  <!-- Kardinalitäten -->
  <g font-weight="bold" font-size="18" text-anchor="middle" fill="#111">
    <text x="275" y="220">1</text>
    <text x="535" y="216">N</text>
  </g>

  <!-- Attribute -->
  <g stroke="#222" stroke-width="1.5" fill="#ffffff">
    <ellipse cx="100" cy="100" rx="45" ry="22"/>
    <ellipse cx="220" cy="100" rx="55" ry="22"/>
    <ellipse cx="560" cy="100" rx="45" ry="22"/>
    <ellipse cx="660" cy="80" rx="50" ry="22"/>
    <ellipse cx="790" cy="80" rx="72" ry="22"/>
    <ellipse cx="890" cy="110" rx="55" ry="22"/>
  </g>
  <g text-anchor="middle" fill="#111">
    <text x="100" y="105">id</text>
    <text x="220" y="105">name</text>
    <text x="560" y="105">id</text>
    <text x="660" y="85">titel</text>
    <text x="790" y="85">beschreibung</text>
    <text x="890" y="115">erledigt</text>
  </g>
  <!-- Unterstreichung Schlüsselattribute -->
  <g stroke="#111" stroke-width="1.3">
    <line x1="92" y1="108" x2="108" y2="108"/>
    <line x1="552" y1="108" x2="568" y2="108"/>
  </g>

  <!-- Legende -->
  <text x="20" y="320" font-size="13" fill="#555">Konzeptuelles ER-Modell (Chen-Notation) · unterstrichen = Schlüsselattribut · Doppellinie = totale Teilnahme (jede Aufgabe hat genau eine Kategorie)</text>
</svg>
