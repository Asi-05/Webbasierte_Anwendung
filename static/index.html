<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Aufgabenverwaltung</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <!-- ========== AUFGABEN ========== -->
    <div class="container">
        <h3>Aufgaben</h3>

        <!-- Eingabefelder für eine neue Aufgabe -->
        <div class="formularzeile">
            <label for="inpTitel">Titel:</label>
            <input type="text" id="inpTitel" placeholder="z.B. Hausaufgaben">
        </div>
        <div class="formularzeile">
            <label for="inpBeschreibung">Beschreibung:</label>
            <input type="text" id="inpBeschreibung">
        </div>
        <div class="formularzeile">
            <label for="inpFaellig">Fällig am:</label>
            <input type="date" id="inpFaellig">
        </div>
        <div class="formularzeile">
            <label for="selKategorie">Kategorie:</label>
            <select id="selKategorie"></select>
        </div>
        <button id="btnSpeichern" onClick="javascript:aufgabeSpeichern()">Aufgabe speichern</button>
        <!-- Nur im Bearbeitungsmodus sichtbar (wird von main.js ein- und ausgeblendet) -->
        <button id="btnAbbrechen" onClick="javascript:bearbeitungBeenden()" style="display: none;">Abbrechen</button>

        <!-- Filter: jede Änderung lädt die Liste sofort neu (gefiltert wird auf dem Server) -->
        <div class="filterzeile">
            <label for="selFilterKategorie">Filter:</label>
            <select id="selFilterKategorie" onChange="javascript:ladeAufgaben()"></select>
            <input type="checkbox" id="chkNurOffene" onChange="javascript:ladeAufgaben()">
            <label for="chkNurOffene">nur offene</label>
        </div>

        <table id="tblAufgabenliste">
            <thead>
                <tr><th>Erledigt</th><th>Titel</th><th>Beschreibung</th><th>Fällig am</th><th>Kategorie</th><th>Aktionen</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- JavaScript am Ende laden, damit alle HTML-Elemente schon existieren -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
