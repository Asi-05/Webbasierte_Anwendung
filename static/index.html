<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Aufgabenverwaltung</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <!-- ========== AUFGABEN ========== -->
    <div class="container">
        <h3>Aufgaben</h3>

        <form id="aufgabeForm">
            <div class="formularzeile">
                <label for="titelInput">Titel:</label>
                <input type="text" id="titelInput" required placeholder="z.B. Hausaufgaben">
            </div>
            <div class="formularzeile">
                <label for="beschreibungInput">Beschreibung:</label>
                <input type="text" id="beschreibungInput">
            </div>
            <div class="formularzeile">
                <label for="kategorieSelect">Kategorie:</label>
                <select id="kategorieSelect"></select>
            </div>
            <button type="submit">Aufgabe speichern</button>
        </form>

        <table id="aufgabeTable">
            <thead>
                <tr><th>Erledigt</th><th>Titel</th><th>Beschreibung</th><th>Kategorie</th><th>Aktionen</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- JavaScript am Ende laden, damit alle HTML-Elemente schon existieren -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
